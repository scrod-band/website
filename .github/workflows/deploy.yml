name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
  schedule:
    # Weekly rebuild (Mondays 08:00 UTC) so past shows expire off the site
    # even when nothing has been published.
    - cron: "0 8 * * 1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare secrets are configured
        id: check
        run: echo "ok=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Install and build
        if: steps.check.outputs.ok == 'true'
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.ok == 'true'
        run: npx wrangler pages deploy _site --project-name=scrod-website --branch=${{ github.ref_name || 'main' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
